<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Pay with Zold</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='22' fill='%23e6167f'/%3E%3Cpath d='M28 68 L52 30 L58 68 M44 32 L78 24' stroke='white' stroke-width='7' fill='none' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E" />
<style>
  :root { --bg:#0b0710; --card:#15101c; --line:#2a2233; --ink:#f5f2f8; --dim:#a99fb5; --acc:#e6167f; --ok:#33c98a; --bad:#ff5d73; --warn:#ffb454; }
  * { box-sizing:border-box; margin:0; padding:0; }
  body { font:15px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif; background:
    radial-gradient(1200px 500px at 50% -10%, #2a0f22 0%, transparent 60%), var(--bg);
    color:var(--ink); min-height:100vh; display:grid; place-items:center; padding:1.25rem; }
  .card { width:100%; max-width:420px; background:var(--card); border:1px solid var(--line);
    border-radius:20px; padding:1.6rem; box-shadow:0 30px 80px rgba(0,0,0,.5); }
  .brand { display:flex; align-items:center; gap:.5rem; font-weight:700; font-size:.9rem; color:var(--dim); margin-bottom:1.3rem; }
  .brand b { color:var(--ink); }
  .amt { text-align:center; margin:.4rem 0 1.4rem; }
  .amt .lbl { color:var(--dim); font-size:.85rem; }
  .amt .val { font-size:2.6rem; font-weight:800; letter-spacing:-.02em; margin-top:.15rem; }
  .amt .to { color:var(--dim); font-size:.9rem; margin-top:.35rem; }
  .amt .to b { color:var(--ink); }
  .row { display:flex; justify-content:space-between; font-size:.86rem; padding:.5rem 0; border-top:1px solid var(--line); color:var(--dim); }
  .row span:last-child { color:var(--ink); }
  button { width:100%; margin-top:1.1rem; padding:.85rem; border:0; border-radius:12px; cursor:pointer;
    font-weight:700; font-size:.95rem; color:#fff; background:linear-gradient(135deg,#a01463,#e6167f); }
  button:hover { filter:brightness(1.08); }
  button:disabled { opacity:.5; cursor:default; }
  .link { display:block; text-align:center; margin-top:1rem; color:var(--acc); font-size:.85rem; text-decoration:none; cursor:pointer; }
  .muted { color:var(--dim); font-size:.8rem; text-align:center; margin-top:1rem; line-height:1.5; }
  .err { margin-top:1rem; padding:.6rem .8rem; border-radius:10px; font-size:.84rem; background:rgba(255,93,115,.09); border:1px solid rgba(255,93,115,.3); color:var(--bad); }
  .note { margin-top:1rem; padding:.6rem .8rem; border-radius:10px; font-size:.82rem; background:rgba(255,180,84,.08); border:1px solid rgba(255,180,84,.28); color:var(--warn); line-height:1.5; }
  .done { text-align:center; }
  .done .ic { width:60px; height:60px; border-radius:50%; margin:.5rem auto 1rem; display:grid; place-items:center;
    background:rgba(51,201,138,.14); font-size:1.8rem; }
  .done.bad .ic { background:rgba(255,93,115,.14); }
  .spin { display:inline-block; width:16px; height:16px; border:2px solid rgba(255,255,255,.35); border-top-color:#fff; border-radius:50%; animation:spin .7s linear infinite; vertical-align:-3px; margin-right:.5rem; }
  @keyframes spin { to { transform:rotate(360deg); } }
  .hidden { display:none !important; }
</style>
</head>
<body>
  <div class="card">
    <div class="brand"><span>🦄</span> Pay with <b>Zold</b></div>

    <div id="load" class="muted">Loading checkout…</div>

    <!-- The amount block stays visible until the result. -->
    <div id="head" class="hidden">
      <div class="amt">
        <div class="lbl">Amount</div>
        <div class="val" id="amt">€0.00</div>
        <div class="to">to <b id="merchant">merchant</b></div>
      </div>
    </div>

    <!-- Existing Zold users only: sign in with the passkey, then approve the payment. -->
    <div id="pay" class="hidden">
      <div class="row"><span>Fee</span><span id="fee">—</span></div>
      <div class="row"><span>You pay</span><span id="total">—</span></div>
      <button id="btn-pay">Sign in and pay</button>
      <div class="muted">You'll approve this payment with your device — Face&nbsp;ID, fingerprint, or screen lock. No passwords.</div>
      <a class="link hidden" id="link-new" target="_blank" rel="noopener">New to Zold? Create an account in the Zold app</a>
    </div>

    <div id="result" class="hidden done">
      <div class="ic" id="ic">✓</div>
      <div id="result-title" style="font-weight:700;font-size:1.1rem"></div>
      <div class="muted" id="result-note"></div>
      <div class="muted" id="redir-note"></div>
    </div>

    <div class="err hidden" id="err"></div>
    <div class="note hidden" id="note"></div>
  </div>

<script type="importmap">
{
  "imports": {
    "crypto": "/vendor/crypto-shim.js",
    "@noble/hashes/crypto": "/vendor/hashes/cryptoBrowser.js"
  }
}
</script>
<script type="module" src="/device.js"></script>
<script>
/* ---------------------------------------------------------------------------
 * Pay with Zold — checkout for EXISTING Zold users.
 *
 * Creating an account (passkey, Safe, identity check) happens in the Zold app;
 * this page signs an existing user in with their passkey and approves one
 * payment, the same way the app's send screen does:
 *
 *   1. propose   POST /api/transfers          server fixes the terms
 *   2. device    sign the terms with the device key (checked against what WE
 *                can see, so a swapped destination is caught before signing)
 *   3. passkey   one assertion for the Safe debit (safeExecution) and one for
 *                the Monerium redeem (moneriumRedeem), each over a server challenge
 *   4. authorize POST /api/transfers/:id/authorize with all three
 *   5. attach    POST /api/checkout/intents/:id/attach, which mints the merchant's code
 *
 * Everything runs on the checkout origin: the passkey is bound to the core's
 * relying-party id (returned with each challenge, never guessed from the
 * hostname) and the device key lives in THIS origin's localStorage.
 * ------------------------------------------------------------------------- */
const $ = (id) => document.getElementById(id);
const deviceLib = new Promise((r) => { window.__deviceLibReady = r; });
const b64url = (buf) => btoa(String.fromCharCode(...new Uint8Array(buf))).replace(/\+/g,"-").replace(/\//g,"_").replace(/=+$/,"");
const b64urlToBytes = (s) => Uint8Array.from(atob(s.replace(/-/g,"+").replace(/_/g,"/")), (c) => c.charCodeAt(0));
const fmt = (n) => "€" + Number(n).toLocaleString("en", { minimumFractionDigits: 2, maximumFractionDigits: 2 });

/* Which account this browser's single device-key slot belongs to. device.js
   keeps one key per origin, not one per user; without this a second person
   binding a key in the same browser would silently take the first person's key
   as their own spending authorizer, and either could then spend the other's balance. */
const KEY_OWNER_SLOT = "zold-checkout-key-owner";
const SHARED_KEY_REFUSAL =
  "this browser already holds a spending key for a different Zold account — pay from your own device, or a private window";

const intentId = new URLSearchParams(location.search).get("intent");
let sessionToken = sessionStorage.getItem("zold-checkout-session") || null;
let user = null, intent = null;

async function request(path, body) {
  const headers = {};
  if (body) headers["content-type"] = "application/json";
  if (sessionToken) headers.authorization = `Bearer ${sessionToken}`;
  const res = await fetch(path, body ? { method:"POST", headers, body:JSON.stringify(body) } : { headers });
  const text = await res.text();
  let data = {};
  try { data = text ? JSON.parse(text) : {}; } catch { data = { error: text.slice(0, 300) }; }
  if (!res.ok) throw new Error(data.error || res.statusText);
  return data;
}
const api = (p, b) => request(p, b);

const showErr = (e) => { const el = $("err"); el.textContent = e.message || String(e); el.classList.remove("hidden"); };
const clearErr = () => $("err").classList.add("hidden");
const showNote = (t) => { const el = $("note"); el.textContent = t; el.classList.remove("hidden"); };
const credId = () => user?.passkey?.credentialId || null;

function show(...ids) {
  for (const id of ["load","pay","result"]) $(id).classList.add("hidden");
  for (const id of ids) $(id).classList.remove("hidden");
}
function busy(btn, label) {
  btn.disabled = true;
  btn.dataset.label = btn.dataset.label || btn.textContent;
  btn.innerHTML = `<span class="spin"></span>${label}`;
}
function idle(btn) {
  btn.disabled = false;
  btn.textContent = btn.dataset.label || btn.textContent;
}

function result(ok, title, note, redirNote) {
  show("result");
  $("head").classList.add("hidden");
  $("result").classList.toggle("bad", !ok);
  $("ic").textContent = ok ? "✓" : "✕";
  $("result-title").textContent = title;
  $("result-note").textContent = note || "";
  $("redir-note").textContent = redirNote || "";
}

/* ---------- load ---------- */

async function load() {
  if (!intentId) { $("load").textContent = "Invalid checkout link."; return; }
  let cfg = {};
  try { cfg = await request("/bff/config"); } catch { /* defaults are the safe ones */ }
  if (cfg.appUrl) { $("link-new").href = cfg.appUrl; $("link-new").classList.remove("hidden"); }
  try { intent = await api(`/api/checkout/intents/${encodeURIComponent(intentId)}`); }
  catch { $("load").textContent = "This checkout could not be loaded."; return; }
  if (intent.expired) return result(false, "Checkout expired", "Ask the merchant to start again.");
  if (intent.status === "PAID") return result(true, "Already paid", `${fmt(intent.amountEur)} to ${intent.merchant || "the merchant"}.`);
  $("amt").textContent = fmt(intent.amountEur);
  $("merchant").textContent = intent.merchant || "the merchant";
  $("head").classList.remove("hidden");
  show("pay");
}

/* ---------- WebAuthn ---------- */

/* A fresh passkey approval for one named change a session alone may not make
   (binding a spending key). The server issues the challenge for that action
   only, so an approval for one change is refused by every other. */
async function passkeyStepUp(action) {
  if (!credId()) return null;
  const { challenge } = await api("/api/webauthn/challenge", { purpose: "step_up", action });
  const dev = await deviceLib;
  return dev.passkeyAssertion({ challenge, credentialId: credId() });
}

async function signIn() {
  if (!window.PublicKeyCredential) throw new Error("passkeys aren't supported in this browser");
  const { challenge } = await api("/api/webauthn/challenge", { purpose: "login" });
  const cred = await navigator.credentials.get({
    publicKey: { challenge: b64urlToBytes(challenge), userVerification: "preferred", timeout: 60000 },
  });
  const u = await api("/api/passkey/login", {
    credentialId: cred.id,
    authenticatorData: b64url(cred.response.authenticatorData),
    clientDataJSON: b64url(cred.response.clientDataJSON),
    signature: b64url(cred.response.signature),
  });
  sessionToken = u.sessionToken;
  sessionStorage.setItem("zold-checkout-session", sessionToken);
  user = u;
  return u;
}

/* ---------- account readiness ---------- */

/* The account must already be fully set up in the Zold app. Say what is missing
   rather than letting the API refuse halfway through the payment. */
function assertReady(u) {
  if (u.kycStatus !== "approved") {
    throw new Error("Your identity check isn't complete yet. Finish it in the Zold app, then come back to this checkout.");
  }
  if (u.passkeySafe && u.passkeySafe.status !== "active") {
    throw new Error("Your account setup isn't finished. Open the Zold app to complete it, then come back to this checkout.");
  }
}

async function keyBelongsToAnotherAccount() {
  const dev = await deviceLib;
  if (!dev.keyStatus().present) return false;
  const owner = localStorage.getItem(KEY_OWNER_SLOT);
  if (owner) return owner !== user.id;
  // No owner on record (a key made by the Zold app on this origin, or left over
  // from an interrupted bind). Only treat it as this account's if the server says
  // this very address is the account's authorizer; never adopt an unknown key.
  if (!user.authorizerAddress) return true;
  const addr = await dev.deviceAddress(credId());
  return addr.toLowerCase() !== user.authorizerAddress.toLowerCase();
}

/* Late binding for accounts that have no spending key yet: mint the key in this
   browser and bind it as the account's authorizer, behind a passkey step-up.
   The server takes the first binding and refuses re-binding by anyone but the
   current device, so this establishes a key, never steals one. */
async function ensureDeviceKey() {
  if (await keyBelongsToAnotherAccount()) throw new Error(SHARED_KEY_REFUSAL);
  if (user.authorizerAddress) return;
  const dev = await deviceLib;
  const { address, protection } = dev.keyStatus().present
    ? { address: await dev.deviceAddress(credId()), protection: dev.keyStatus().protection }
    : await dev.createKey(credId());
  const updated = await api(`/api/users/${user.id}/authorizer`, { address, stepUp: await passkeyStepUp("authorizer.bind") });
  localStorage.setItem(KEY_OWNER_SLOT, user.id);
  if (updated.authorizerAddress) user = { ...user, authorizerAddress: updated.authorizerAddress };
  if (protection !== "prf") {
    showNote("Your spending key is stored unencrypted in this browser — this device's authenticator doesn't support the PRF extension.");
  }
}

/* ---------- payment ---------- */

/* Two quotes: the first reveals the flat fee, the second sizes the send so the
   merchant receives exactly the intent amount. Quotes are sender-fixed. */
async function quoteForMerchant() {
  const probe = await api("/api/quotes", { userId: user.id, rail: "sepa", sendEur: intent.amountEur });
  const fee = Math.round((probe.sendEur - probe.receiveEur) * 100) / 100;
  const quote = await api("/api/quotes", { userId: user.id, rail: "sepa", sendEur: intent.amountEur + fee });
  return { quote, fee };
}

async function payAndAttach(quote) {
  const recipient = { recipientName: intent.merchant || "Merchant", recipientIban: intent.merchantIban };
  // 1. Propose. The merchant's own reference rides on the SEPA payment, so the
  //    money arrives on their statement tied to their order, and the attach
  //    step checks it matches. Not covered by the signed destination commitment:
  //    it decides what the payee reads, not who gets paid.
  const created = await api("/api/transfers", {
    quoteId: quote.id,
    ...recipient,
    ...(intent.reference ? { reference: intent.reference } : {}),
  });

  // 2. Device key: sign the exact terms.
  const dev = await deviceLib;
  if (!dev.keyStatus().present) {
    throw new Error("this browser has no spending key for your account — pay from the device you set Zold up on");
  }
  const addr = await dev.deviceAddress(credId());
  if (created.authorization.authorizer.toLowerCase() !== addr.toLowerCase()) {
    throw new Error("your spending key was set up in a different browser — pay from that device, or open the Zold app to rotate it");
  }
  // Recompute what the server asked us to sign from the recipient we can see.
  // A server that swapped the merchant's IBAN is caught here, before the
  // passkey ever unlocks the key.
  const expected = dev.destinationCommitment("sepa", { iban: recipient.recipientIban, name: recipient.recipientName });
  if (created.authorization.typedData.message.destination.toLowerCase() !== expected.toLowerCase()) {
    throw new Error("the signed payout destination does not match this merchant — not signing");
  }
  const signature = await dev.signTypedData(created.authorization.typedData, credId());

  // 3. Passkey: approve the Safe debit and the Monerium redeem. Each is its own
  //    user-verified assertion over a challenge the server issued; the API
  //    refuses to move money without them. Undefined when there is nothing to approve.
  const execution = await dev.passkeyAssertion(created.authorization.safeExecution);
  const redeem = await dev.passkeyAssertion(created.authorization.moneriumRedeem);

  // 4. Authorize.
  const t = await api(`/api/transfers/${created.id}/authorize`, {
    signature,
    ...(execution ? { executionAssertion: execution } : {}),
    ...(redeem ? { moneriumRedeemAssertion: redeem } : {}),
  });

  // 5. Attach. The intent view calls this field `intentId`, not `id`.
  const { redirectUrl } = await api(`/api/checkout/intents/${intentId}/attach`, { transferId: t.id });
  return redirectUrl;
}

function finish(redirectUrl) {
  // The payment is done: forget the session, and only follow a redirect that is
  // https (or plain http on this machine, for local runs).
  sessionStorage.removeItem("zold-checkout-session");
  sessionToken = null;
  let target = null;
  try { target = new URL(redirectUrl, location.origin); } catch { /* handled below */ }
  const local = target && ["localhost", "127.0.0.1", "[::1]"].includes(target.hostname);
  if (!target || (target.protocol !== "https:" && !(local && target.protocol === "http:"))) {
    return result(true, "Payment sent", `${fmt(intent.amountEur)} to ${intent.merchant || "the merchant"}.`,
      "We couldn't return you to the merchant automatically. You can close this page.");
  }
  result(true, "Payment sent", `${fmt(intent.amountEur)} to ${intent.merchant || "the merchant"}.`, "Returning to the merchant…");
  setTimeout(() => { location.href = target.href; }, 1400);
}

$("btn-pay").onclick = async () => {
  clearErr();
  const btn = $("btn-pay");
  busy(btn, "Signing in…");
  try {
    if (!user) await signIn();
    const me = await api(`/api/users/${user.id}`);
    user = { ...user, ...me };
    assertReady(user);
    busy(btn, "Preparing…");
    await ensureDeviceKey();
    const { quote, fee } = await quoteForMerchant();
    $("fee").textContent = fmt(fee);
    $("total").textContent = fmt(quote.sendEur);
    // The debit comes out of the account's Safe, so that is the balance that counts.
    const available = user.safeBalanceEur ?? user.balanceEur ?? 0;
    if (available < quote.sendEur - 0.001) {
      throw new Error(`Not enough balance (${fmt(available)}). Top up in the Zold app, then return here.`);
    }
    busy(btn, "Approve on your device…");
    finish(await payAndAttach(quote));
  } catch (e) {
    showErr(e);
    idle(btn);
  }
};

load();
</script>
</body>
</html>
